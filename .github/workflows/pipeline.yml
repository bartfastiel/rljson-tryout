name: Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # A superseded pull request run is cancelled; a run on main is never
  # interrupted because it may be in the middle of a Terraform apply.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Determine the Playwright version
        id: playwright-version
        working-directory: packages/web-app
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Skips the download when the cache holds the browser and still
      # installs the system libraries Chromium needs on the runner.
      - name: Install Playwright browsers
        working-directory: packages/web-app
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        id: end-to-end-tests
        run: pnpm --filter @rljson-tryout/web-app test:e2e

      - name: Upload Playwright report
        if: failure() && steps.end-to-end-tests.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/web-app/playwright-report
          retention-days: 7

      - name: Sonar scan
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Sonar quality gate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Runs after the quality gate step so the analysis it waited for has
      # already landed on SonarCloud. The project is public, so the search
      # needs no token; SONAR_TOKEN is sent as the basic auth user with an
      # empty password in case the API ever starts requiring one.
      - name: Sonar issues on new code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          response="$(curl -s --max-time 15 -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=bartfastiel_rljson-tryout&pullRequest=${PULL_REQUEST_NUMBER}&resolved=false&ps=100")"
          total="$(printf '%s' "${response}" | jq -r '.total // empty')"
          if [ -z "${total}" ]; then
            echo "::error::Could not read the Sonar issue count from the response: ${response}"
            exit 1
          fi
          if [ "${total}" != "0" ]; then
            printf '%s' "${response}" | jq -r \
              '.issues[] | (.component | sub("^bartfastiel_rljson-tryout:"; "")) as $file | if .line then "::error file=\($file),line=\(.line)::\(.rule) \(.message)" else "::error file=\($file)::\(.rule) \(.message)" end'
            echo "::error::${total} open Sonar issue(s) on the new code of this pull request. See https://sonarcloud.io/project/issues?id=bartfastiel_rljson-tryout&pullRequest=${PULL_REQUEST_NUMBER}&resolved=false"
            exit 1
          fi

  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/node-service
    outputs:
      image: ${{ steps.image-reference.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine whether this build may push
        id: push-decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            push=true
          elif [ "$EVENT_NAME" = "pull_request" ] \
            && [ "$PR_HEAD_REPO" = "$REPOSITORY" ] \
            && [ "$PR_USER_LOGIN" != "dependabot[bot]" ]; then
            push=true
          else
            push=false
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.push-decision.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/node-service/Dockerfile
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          push: ${{ steps.push-decision.outputs.push == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Registry paths are lower-case; the repository name in the env block
      # keeps the owner's spelling.
      - name: Expose the image reference
        id: image-reference
        run: echo "image=${IMAGE_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  terraform-cluster:
    name: terraform-cluster
    needs: checks
    # Forks and Dependabot receive no secrets, so they cannot plan.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Applies on main queue up in one group; pull request plans are read-only
    # and get a group of their own so they never displace an apply.
    concurrency:
      group: ${{ github.event_name == 'push' && 'cluster' || format('cluster-plan-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/cluster
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start the Terraform session
        uses: ./.github/actions/terraform-session
        with:
          working-directory: infra/terraform/cluster
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Plan
        if: github.event_name == 'pull_request'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform plan -input=false -lock=false -no-color

      - name: Plan for apply
        if: github.event_name == 'push'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        if: github.event_name == 'push'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform apply -input=false -no-color tfplan

      # k3s runs the API server with anonymous authentication off, so the
      # expected answer is a 401 Status body; a version body is accepted too.
      - name: Wait for the Kubernetes API server
        if: github.event_name == 'push'
        run: |
          server_ipv4="$(terraform output -raw server_ipv4)"
          version_url="https://${server_ipv4}:6443/version"
          deadline=$((SECONDS + 720))
          body=""
          until printf '%s' "${body}" | grep -Eq '"gitVersion"|"code": ?40[13]'; do
            if ((SECONDS >= deadline)); then
              echo "::error::${version_url} did not answer within twelve minutes. Last body: ${body}"
              exit 1
            fi
            sleep 10
            body="$(curl -sk --max-time 10 "${version_url}" || true)"
          done
          echo "${version_url} answered:"
          printf '%s\n' "${body}"

      # The kubeconfig grants cluster administrator rights: it lives in a
      # file with mode 600 for the duration of this step and is never printed.
      - name: Verify the kubeconfig
        if: github.event_name == 'push'
        run: |
          kubeconfig_file="$(mktemp)"
          chmod 600 "${kubeconfig_file}"
          trap 'rm -f "${kubeconfig_file}"' EXIT
          terraform output -raw kubeconfig > "${kubeconfig_file}"
          kubectl --kubeconfig "${kubeconfig_file}" wait node --all --for=condition=Ready --timeout=180s
          nodes="$(kubectl --kubeconfig "${kubeconfig_file}" get nodes -o wide)"
          printf '%s\n' "${nodes}"
          ready_count="$(printf '%s\n' "${nodes}" | tail -n +2 | awk '$2 == "Ready"' | wc -l)"
          if [ "${ready_count}" -ne 1 ]; then
            echo "::error::Expected exactly one node in Ready, found ${ready_count}."
            exit 1
          fi

  terraform-workloads:
    name: terraform-workloads
    needs: [checks, image, terraform-cluster]
    # Forks and Dependabot receive no secrets, so they cannot plan.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Applies on main queue up in one group; pull request plans are read-only
    # and get a group of their own so they never displace an apply.
    concurrency:
      group: ${{ github.event_name == 'push' && 'workloads-production' || format('workloads-plan-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/workloads
    env:
      TF_VAR_image: ${{ needs.image.outputs.image }}
      TF_VAR_letsencrypt_email: ${{ secrets.LETSENCRYPT_EMAIL }}
    outputs:
      deployment_urls: ${{ steps.deployment.outputs.urls }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start the Terraform session
        uses: ./.github/actions/terraform-session
        with:
          working-directory: infra/terraform/workloads
          workspace: production
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -lock=false -no-color

      - name: Plan for apply
        if: github.event_name == 'push'
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -no-color tfplan

      - name: Expose the deployment URLs
        id: deployment
        if: github.event_name == 'push'
        run: |
          node_urls="$(terraform output -json node_urls | jq -r 'join(" ")')"
          apex_url="$(terraform output -raw apex_url)"
          if [ -z "${node_urls}" ] || [ -z "${apex_url}" ]; then
            echo "::error::The Terraform outputs node_urls and apex_url must not be empty."
            exit 1
          fi
          echo "urls=${node_urls} ${apex_url}" >> "$GITHUB_OUTPUT"

  smoke:
    name: smoke
    needs: [terraform-workloads]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOYMENT_URLS: ${{ needs.terraform-workloads.outputs.deployment_urls }}
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify the deployment
        run: infra/scripts/verify-deployment.sh
