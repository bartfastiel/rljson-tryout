name: Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # A superseded pull request run is cancelled; a run on main is never
  # interrupted because it may be in the middle of a Terraform apply.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Determine the Playwright version
        id: playwright-version
        working-directory: packages/web-app
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Skips the download when the cache holds the browser and still
      # installs the system libraries Chromium needs on the runner.
      - name: Install Playwright browsers
        working-directory: packages/web-app
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        id: end-to-end-tests
        run: pnpm --filter @rljson-tryout/web-app test:e2e

      - name: Upload Playwright report
        if: failure() && steps.end-to-end-tests.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/web-app/playwright-report
          retention-days: 7

      - name: Sonar scan
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Sonar quality gate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-reference.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine whether this build may push
        id: push-decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            push=true
          elif [ "$EVENT_NAME" = "pull_request" ] \
            && [ "$PR_HEAD_REPO" = "$REPOSITORY" ] \
            && [ "$PR_USER_LOGIN" != "dependabot[bot]" ]; then
            push=true
          else
            push=false
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.push-decision.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/bartfastiel/rljson-tryout/node-service
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/node-service/Dockerfile
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          push: ${{ steps.push-decision.outputs.push == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Expose the image reference
        id: image-reference
        run: echo "image=ghcr.io/bartfastiel/rljson-tryout/node-service:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  terraform-cluster:
    name: terraform-cluster
    needs: checks
    # Forks and Dependabot receive no secrets, so they cannot plan.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Applies on main queue up in one group; pull request plans are read-only
    # and get a group of their own so they never displace an apply.
    concurrency:
      group: ${{ github.event_name == 'push' && 'cluster' || format('cluster-plan-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/cluster
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialise
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        if: github.event_name == 'pull_request'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform plan -input=false -lock=false -no-color

      - name: Plan for apply
        if: github.event_name == 'push'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        if: github.event_name == 'push'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform apply -input=false -no-color tfplan

      # k3s runs the API server with anonymous authentication off, so the
      # expected answer is a 401 Status body; a version body is accepted too.
      - name: Wait for the Kubernetes API server
        if: github.event_name == 'push'
        run: |
          server_ipv4="$(terraform output -raw server_ipv4)"
          version_url="https://${server_ipv4}:6443/version"
          deadline=$((SECONDS + 720))
          body=""
          until printf '%s' "${body}" | grep -Eq '"gitVersion"|"code": ?40[13]'; do
            if ((SECONDS >= deadline)); then
              echo "::error::${version_url} did not answer within twelve minutes. Last body: ${body}"
              exit 1
            fi
            sleep 10
            body="$(curl -sk --max-time 10 "${version_url}" || true)"
          done
          echo "${version_url} answered:"
          printf '%s\n' "${body}"

      # The kubeconfig grants cluster administrator rights: it lives in a
      # file with mode 600 for the duration of this step and is never printed.
      - name: Verify the kubeconfig
        if: github.event_name == 'push'
        run: |
          kubeconfig_file="$(mktemp)"
          chmod 600 "${kubeconfig_file}"
          trap 'rm -f "${kubeconfig_file}"' EXIT
          terraform output -raw kubeconfig > "${kubeconfig_file}"
          kubectl --kubeconfig "${kubeconfig_file}" wait node --all --for=condition=Ready --timeout=180s
          nodes="$(kubectl --kubeconfig "${kubeconfig_file}" get nodes -o wide)"
          printf '%s\n' "${nodes}"
          ready_count="$(printf '%s\n' "${nodes}" | tail -n +2 | awk '$2 == "Ready"' | wc -l)"
          if [ "${ready_count}" -ne 1 ]; then
            echo "::error::Expected exactly one node in Ready, found ${ready_count}."
            exit 1
          fi
