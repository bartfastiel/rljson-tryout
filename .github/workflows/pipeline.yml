name: Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# One run per branch at a time. A run is never cancelled while it is in
# progress, because both the main run and a pull request run apply
# Terraform (production, or the preview of the pull request) and a killed
# apply leaves a stale state lock behind; a superseded run that has not
# started yet is dropped as usual.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Determine the Playwright version
        id: playwright-version
        working-directory: packages/web-app
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Skips the download when the cache holds the browser and still
      # installs the system libraries Chromium needs on the runner.
      - name: Install Playwright browsers
        working-directory: packages/web-app
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        id: end-to-end-tests
        run: pnpm --filter @rljson-tryout/web-app test:e2e

      - name: Upload Playwright report
        if: failure() && steps.end-to-end-tests.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/web-app/playwright-report
          retention-days: 7

      - name: Sonar scan
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Sonar quality gate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Runs after the quality gate step so the analysis it waited for has
      # already landed on SonarCloud. The project is public, so the search
      # needs no token; SONAR_TOKEN is sent as the basic auth user with an
      # empty password in case the API ever starts requiring one.
      - name: Sonar issues on new code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          response="$(curl -s --max-time 15 -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=bartfastiel_rljson-tryout&pullRequest=${PULL_REQUEST_NUMBER}&resolved=false&ps=100")"
          total="$(printf '%s' "${response}" | jq -r '.total // empty')"
          if [ -z "${total}" ]; then
            echo "::error::Could not read the Sonar issue count from the response: ${response}"
            exit 1
          fi
          if [ "${total}" != "0" ]; then
            printf '%s' "${response}" | jq -r \
              '.issues[] | (.component | sub("^bartfastiel_rljson-tryout:"; "")) as $file | if .line then "::error file=\($file),line=\(.line)::\(.rule) \(.message)" else "::error file=\($file)::\(.rule) \(.message)" end'
            echo "::error::${total} open Sonar issue(s) on the new code of this pull request. See https://sonarcloud.io/project/issues?id=bartfastiel_rljson-tryout&pullRequest=${PULL_REQUEST_NUMBER}&resolved=false"
            exit 1
          fi

  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/node-service
    outputs:
      image: ${{ steps.image-reference.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine whether this build may push
        id: push-decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            push=true
          elif [ "$EVENT_NAME" = "pull_request" ] \
            && [ "$PR_HEAD_REPO" = "$REPOSITORY" ] \
            && [ "$PR_USER_LOGIN" != "dependabot[bot]" ]; then
            push=true
          else
            push=false
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.push-decision.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/node-service/Dockerfile
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          push: ${{ steps.push-decision.outputs.push == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Registry paths are lower-case; the repository name in the env block
      # keeps the owner's spelling.
      - name: Expose the image reference
        id: image-reference
        run: echo "image=${IMAGE_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  terraform-cluster:
    name: terraform-cluster
    needs: checks
    # Forks and Dependabot receive no secrets, so they cannot plan.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Applies on main queue up in one group; pull request plans are read-only
    # and get a group of their own so they never displace an apply.
    concurrency:
      group: ${{ github.event_name == 'push' && 'cluster' || format('cluster-plan-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/cluster
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start the Terraform session
        uses: ./.github/actions/terraform-session
        with:
          working-directory: infra/terraform/cluster
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Plan
        if: github.event_name == 'pull_request'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform plan -input=false -lock=false -no-color

      - name: Plan for apply
        if: github.event_name == 'push'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        if: github.event_name == 'push'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform apply -input=false -no-color tfplan

      - name: Wait for the Kubernetes API server
        if: github.event_name == 'push'
        run: ../../scripts/wait-for-kubernetes-api.sh

      - name: Verify the kubeconfig
        if: github.event_name == 'push'
        run: ../../scripts/verify-kubeconfig.sh

  # Deploys workspace production on main and the preview workspace pr-<n>
  # of a pull request; the workspace name selects the environment in the
  # Terraform stage. A pull request that was closed while this run was in
  # its earlier jobs gets no preview: the Terraform steps are skipped and
  # the job ends without deployment URLs, so smoke is skipped as well.
  terraform-workloads:
    name: terraform-workloads
    needs: [checks, image, terraform-cluster]
    # Forks and Dependabot receive no secrets, so they cannot apply.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    # One group per workspace: applies to production queue up behind each
    # other, and the preview of a pull request never races its own
    # preview-destroy run, which shares the group.
    concurrency:
      group: ${{ github.event_name == 'push' && 'workloads-production' || format('workloads-pr-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/workloads
    env:
      TF_VAR_image: ${{ needs.image.outputs.image }}
      TF_VAR_letsencrypt_email: ${{ secrets.LETSENCRYPT_EMAIL }}
    outputs:
      deployment_urls: ${{ steps.deployment.outputs.urls }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Read live, right after this job took the workspace's concurrency
      # group, so that a pull request closed meanwhile is not deployed on
      # top of the preview-destroy run that already cleaned up.
      - name: Check that the pull request is still open
        id: pull-request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state="$(gh pr view "${PULL_REQUEST_NUMBER}" --json state --jq .state)"
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          if [ "${state}" != "OPEN" ]; then
            echo "::notice::Pull request ${PULL_REQUEST_NUMBER} is ${state}; its preview is not deployed."
          fi

      - name: Start the Terraform session
        if: github.event_name == 'push' || steps.pull-request.outputs.state == 'OPEN'
        uses: ./.github/actions/terraform-session
        with:
          working-directory: infra/terraform/workloads
          workspace: ${{ github.event_name == 'push' && 'production' || format('pr-{0}', github.event.pull_request.number) }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}

      - name: Check formatting
        if: github.event_name == 'push' || steps.pull-request.outputs.state == 'OPEN'
        run: terraform fmt -check -recursive

      - name: Validate
        if: github.event_name == 'push' || steps.pull-request.outputs.state == 'OPEN'
        run: terraform validate

      - name: Plan for apply
        if: github.event_name == 'push' || steps.pull-request.outputs.state == 'OPEN'
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        if: github.event_name == 'push' || steps.pull-request.outputs.state == 'OPEN'
        run: terraform apply -input=false -no-color tfplan

      - name: Expose the deployment URLs
        id: deployment
        if: github.event_name == 'push' || steps.pull-request.outputs.state == 'OPEN'
        run: |
          urls="$(terraform output -json deployment_urls | jq -r 'join(" ")')"
          if [ -z "${urls}" ]; then
            echo "::error::The Terraform output deployment_urls must not be empty."
            exit 1
          fi
          echo "urls=${urls}" >> "$GITHUB_OUTPUT"

  # Production must present a certificate the runner trusts; a preview is
  # signed by the Let's Encrypt staging issuer, which no runner trusts, so
  # its chain is skipped and the issuer must carry the staging mark instead.
  smoke:
    name: smoke
    needs: [terraform-workloads]
    if: needs.terraform-workloads.outputs.deployment_urls != '' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DEPLOYMENT_URLS: ${{ needs.terraform-workloads.outputs.deployment_urls }}
      EXPECTED_COMMIT: ${{ github.sha }}
      ALLOW_STAGING_CERTIFICATE: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify the deployment
        run: infra/scripts/verify-deployment.sh

      # One comment per pull request, updated on every later deployment.
      - name: Comment the preview on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_STATUS: deployed
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: infra/scripts/post-preview-comment.sh
