sonar.organization=bartfastiel-github
sonar.projectKey=bartfastiel_rljson-tryout

# Source and test code live side by side inside each package, so sources and
# tests share the same root; sonar.test.inclusions pulls the test files out
# into test scope.
sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/features/**
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**

sonar.coverage.exclusions=packages/web-app/**,**/*.test.ts,**/features/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
